<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLB Test</title>
<style>
  body { margin: 0; background: #0a0a0c; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #info { position: absolute; top: 10px; left: 10px; color: #f0f0f0; font-family: monospace; font-size: 12px; z-index: 10; }
</style>
</head>
<body>
<div id="info">Loading model...</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.min.js"></script>
<script>
var scene, camera, renderer;

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a0c);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 0, 8);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);

  var ambient = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(ambient);

  var dir = new THREE.DirectionalLight(0xffffff, 1);
  dir.position.set(5, 10, 7);
  scene.add(dir);

  var loader = new THREE.GLTFLoader();
  loader.load(
    '/basketball-player.glb',
    function(gltf) {
      var model = gltf.scene;
      
      // Center and scale
      var box = new THREE.Box3().setFromObject(model);
      var center = box.getCenter(new THREE.Vector3());
      var size = box.getSize(new THREE.Vector3());
      var maxDim = Math.max(size.x, size.y, size.z);
      model.position.sub(center);
      model.scale.setScalar(4.0 / maxDim);

      scene.add(model);
      document.getElementById('info').textContent = 'Loaded! Meshes: ' + countMeshes(model);
      animate();
    },
    function(progress) {
      var pct = Math.round((progress.loaded / progress.total) * 100);
      document.getElementById('info').textContent = 'Loading: ' + pct + '%';
    },
    function(error) {
      document.getElementById('info').textContent = 'ERROR: ' + error.message;
      console.error('Load error:', error);
    }
  );

  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function countMeshes(obj) {
  var count = 0;
  obj.traverse(function(o) {
    if (o.isMesh) count++;
  });
  return count;
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

init();
</script>
</body>
</html>
